name: Ubuntu installer

on:
  push:
    branches: [main, codex/ubuntu-installer]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the verified installer as the latest GitHub release'
        required: false
        default: false
        type: boolean
      verify_run:
        description: 'Optional run ID of an existing installer to verify again'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb desktop-file-utils
      - name: Build the Ubuntu installer
        if: inputs.verify_run == ''
        run: npm run dist:ubuntu
      - name: Download the existing installer
        if: inputs.verify_run != ''
        uses: actions/download-artifact@v4
        with:
          name: Lodex-ubuntu-amd64
          path: release
          run-id: ${{ inputs.verify_run }}
          github-token: ${{ github.token }}
      - name: Normalize earlier artifact layouts
        if: inputs.verify_run != ''
        run: |
          if [[ -d release/release ]]; then cp release/release/*.deb release/; fi
      - name: Test streaming and recovery regressions
        if: inputs.verify_run == ''
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Install and verify the package
        run: bash scripts/verify-ubuntu-package.sh
      - name: Verify native desktop controls
        if: inputs.verify_run == ''
        run: LODEX_TEST_EXECUTABLE=/usr/bin/lodex xvfb-run -a node --test tests/desktop.test.cjs
      - name: Verify the Ubuntu update installer
        if: inputs.verify_run == ''
        run: node scripts/verify-update-installer.cjs
      - name: Verify local voice typing with real audio
        if: inputs.verify_run == ''
        run: LODEX_TEST_EXECUTABLE=/usr/bin/lodex xvfb-run -a node scripts/verify-dictation.cjs | tee release/voice-smoke.log
      - name: Save installer and verification output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lodex-ubuntu-amd64
          if-no-files-found: error
          path: |
            release/*.deb
            release/SHA256SUMS
            release/ubuntu-smoke.log
            release/ubuntu-diagnostics.log
            release/ubuntu-smoke.png
            release/voice-smoke.log
      - name: Save interface verification screenshots
        uses: actions/upload-artifact@v4
        if: always() && inputs.verify_run == ''
        with:
          name: Lodex-UI-regression-screenshots
          if-no-files-found: ignore
          path: test-results/*.png

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.verify_run == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lodex-ubuntu-amd64
          path: release
      - name: Publish verified Ubuntu installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/RELEASE-${version}.md"
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "v${version}" "release/Lodex-${version}-amd64.deb" release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Lodex ${version} for Ubuntu" --latest \
            --notes-file "docs/RELEASE-${version}.md"
